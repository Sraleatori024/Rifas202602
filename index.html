    <meta property="og:title" content="Chance Club" />
    <meta property="og:description" content="Plataforma profissional de campanhas promocionais com participações em campanhas especiais de forma transparente e segura." />
    <script>
      // Prevent some libraries from crashing when they try to overwrite window.fetch
      // This is a common issue in some sandboxed environments.
      (function() {
        try {
          const originalFetch = window.fetch;
          if (originalFetch) {
            Object.defineProperty(window, 'fetch', {
              get: () => originalFetch,
              set: (v) => { console.warn('Attempted to overwrite fetch, ignoring.'); },
              configurable: true
            });
          }
        } catch (e) {
          // Ignore errors during property definition
        }
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
